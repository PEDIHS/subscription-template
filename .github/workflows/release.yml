name: Release

on:
    release:
        types: [published]
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - .github/workflows/release.yml

env:
    DEFAULT_FALLBACK_LANGUAGE: fa

permissions:
    contents: write

jobs:
    detect-languages:
        name: Detect languages
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.languages.outputs.matrix }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Find available locales
              id: languages
              run: |
                  node <<'NODE' >> "$GITHUB_OUTPUT"
                  const fs = require('fs');
                  const languages = fs
                    .readdirSync('src/locales')
                    .filter((file) => file.endsWith('.json'))
                    .map((file) => file.replace(/\.json$/, ''));

                  if (!languages.length) {
                    throw new Error('No locale files found in src/locales');
                  }

                  console.log(`matrix=${JSON.stringify(languages)}`);
                  NODE

    build:
        name: Build (${{ matrix.lang }})
        needs: detect-languages
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                lang: ${{ fromJson(needs.detect-languages.outputs.matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build for ${{ matrix.lang }}
              run: bun run build
              env:
                  VITE_FALLBACK_LANGUAGE: ${{ matrix.lang }}

            - name: Package artifact
              run: |
                  mkdir -p artifacts
                  cp dist/index.html "artifacts/${{ matrix.lang }}.html"

                  if [ "${{ matrix.lang }}" = "${{ env.DEFAULT_FALLBACK_LANGUAGE }}" ]; then
                    cp dist/index.html artifacts/index.html
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.lang }}-html
                  path: artifacts
                  if-no-files-found: error

    publish:
        name: Attach assets to release
        needs: build
        if: github.event_name == 'release' || github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-assets

            - name: Publish release assets
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event_name == 'push' && 'v3.0.0' || github.ref_name }}
                  name: ${{ github.event_name == 'push' && 'v3.0.0' || github.event.release.name }}
                  generate_release_notes: ${{ github.event_name == 'push' }}
                  make_latest: true
                  files: release-assets/**/*.html
